spring.application.name=recetario

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/securitydb?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
registration.admin.code=${REGISTRATION_ADMIN_CODE:}
registration.chef.code=${REGISTRATION_CHEF_CODE:}
